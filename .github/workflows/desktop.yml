name: Desktop builds

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows-x64
            target: windows
          - os: macos-15
            platform: macos-arm64
            target: macos
          - os: ubuntu-24.04
            platform: linux-x64
            target: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: Build Flutter app
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: flutter build "$TARGET" --release --no-pub
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item ../LICENSE build/windows/x64/runner/Release/LICENSE.txt
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/SegmentDesk-windows-x64-no-install.zip
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $versionLine = Get-Content pubspec.yaml | Where-Object { $_ -match '^version:\s+\d+\.\d+\.\d+\+\d+$' }
          if (-not $versionLine) { throw 'Cannot read app version from pubspec.yaml' }
          $version = ($versionLine -split '[:+]')[1].Trim()
          & $compiler "/DAppVersion=$version" 'packaging/windows/SegmentDesk.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test and package Chrome extension
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: .
        run: |
          node --test browser-extension/media.test.mjs browser-extension/worker.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./browser-extension/build.ps1 -OutputDirectory desktop/dist
      - name: Smoke-test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'SegmentDesk-install-test'
          $setup = Start-Process -FilePath (Resolve-Path 'dist/SegmentDesk-windows-x64-setup.exe') -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/DIR="' + $target + '"')) -Wait -PassThru -WindowStyle Hidden
          if ($setup.ExitCode -ne 0) { throw "Installer exited with code $($setup.ExitCode)" }
          foreach ($entry in 'stream_download.exe', 'segmentdesk_import.exe', 'native_import.json', 'flutter_windows.dll', 'data/flutter_assets') {
            if (-not (Test-Path -LiteralPath (Join-Path $target $entry))) { throw "Missing installed file: $entry" }
          }
          $hostKey = 'HKCU:\Software\Google\Chrome\NativeMessagingHosts\com.segmentdesk.import'
          if ((Get-Item -LiteralPath $hostKey).GetValue('') -ne (Join-Path $target 'native_import.json')) {
            throw 'Chrome native messaging host registration is missing or incorrect'
          }
          $uninstaller = Get-ChildItem -LiteralPath $target -Filter 'unins*.exe' | Select-Object -First 1
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru -WindowStyle Hidden
          if ($uninstall.ExitCode -ne 0 -or (Test-Path -LiteralPath (Join-Path $target 'stream_download.exe')) -or (Test-Path -LiteralPath $hostKey)) {
            throw 'Uninstall smoke test failed'
          }
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          app="build/macos/Build/Products/Release/SegmentDesk.app"
          lipo "$app/Contents/MacOS/SegmentDesk" -verify_arch arm64
          cp ../LICENSE build/macos/Build/Products/Release/LICENSE.txt
          ditto -c -k --keepParent "$app" dist/SegmentDesk-macos-arm64.zip
          archive="$PWD/dist/SegmentDesk-macos-arm64.zip"
          (cd build/macos/Build/Products/Release && zip "$archive" LICENSE.txt)
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          bundle=build/linux/x64/release/bundle
          cp ../LICENSE "$bundle/LICENSE.txt"
          tar -C "$bundle" -czf dist/SegmentDesk-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: segmentdesk-${{ matrix.platform }}
          path: desktop/dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: segmentdesk-*
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum SegmentDesk-* > SHA256SUMS.txt
          gh release create "$TAG" SegmentDesk-* SHA256SUMS.txt --verify-tag --latest --generate-notes --title "SegmentDesk $TAG"
