name: Desktop builds

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows-x64
            target: windows
          - os: macos-15
            platform: macos-arm64
            target: macos
          - os: ubuntu-24.04
            platform: linux-x64
            target: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: Build Flutter app
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: flutter build "$TARGET" --release --no-pub
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item ../LICENSE build/windows/x64/runner/Release/LICENSE.txt
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/SegmentDesk-windows-x64.zip
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          app="build/macos/Build/Products/Release/SegmentDesk.app"
          lipo "$app/Contents/MacOS/SegmentDesk" -verify_arch arm64
          cp ../LICENSE build/macos/Build/Products/Release/LICENSE.txt
          ditto -c -k --keepParent "$app" dist/SegmentDesk-macos-arm64.zip
          archive="$PWD/dist/SegmentDesk-macos-arm64.zip"
          (cd build/macos/Build/Products/Release && zip "$archive" LICENSE.txt)
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          bundle=build/linux/x64/release/bundle
          cp ../LICENSE "$bundle/LICENSE.txt"
          tar -C "$bundle" -czf dist/SegmentDesk-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: segmentdesk-${{ matrix.platform }}
          path: desktop/dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: segmentdesk-*
          path: dist
          merge-multiple: true
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum SegmentDesk-* > SHA256SUMS.txt
          gh release create "$TAG" SegmentDesk-* SHA256SUMS.txt --verify-tag --prerelease --generate-notes --title "SegmentDesk $TAG"
