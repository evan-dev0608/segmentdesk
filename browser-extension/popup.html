<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>SegmentDesk 媒体检测</title>
<link rel="stylesheet" href="popup.css">
<header class="masthead">
  <img src="icon.png" alt="" width="34" height="34">
  <div class="identity">
    <h1>SegmentDesk</h1>
    <p id="site">媒体检测</p>
  </div>
  <button id="capture" aria-pressed="false" disabled>开始检测</button>
</header>
<main>
  <div class="section-head">
    <h2>当前页面</h2>
    <span id="count" aria-live="polite">0 项</span>
  </div>
  <section id="empty">
    <div class="empty-icon" aria-hidden="true"><span></span></div>
    <h3 id="empty-title">还没有媒体</h3>
    <p id="empty-description">开始检测后，在网页上播放视频。</p>
  </section>
  <ul id="results" aria-label="检测到的媒体"></ul>
  <p id="status" role="status"></p>
</main>
<script type="module" src="popup.js"></script>
</html>
